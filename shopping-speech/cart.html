<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/header.css" />
    <style>
      #products__container {
        display: flex;
        justify-content: center;
        margin-top: 100px;
      }

      #products {
        width: 60%;
      }

      #products .product {
        display: flex;
        align-items: center;
        gap: 40px;
        border-bottom: 1px solid black;
      }

      #products .product img {
        height: 110px;
      }

      .remove__button__container {
        width: 100%;
        text-align: right;
        padding-right: 20px;
      }

      .remove__button__container svg {
        cursor: pointer;
      } 

    </style>
  </head>
  <body>
    <header>
      <a href="index.html" id="logo">
        <img src="images/main-logo.png" alt="" />
      </a>

      <nav>
        <ul id="nav__items">
          <li class="nav__item"><a href="#products">Products</a></li>
          <li class="nav__item"><a href="cart.html">Cart</a></li>
          <li class="nav__item"><a href="#about">About Us</a></li>
          <li class="nav__item"><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div id="products__container">
        <ul id="products"></ul>
      </div>
    </main>

    <footer></footer>

    <script>
      let url = "https://dummyjson.com/products";
      let cartProducts = JSON.parse(localStorage.getItem("cartProducts")) || [];

      async function fetchProducts(url) {
        const response = await fetch(url);

        if (!response.ok) {
          alert("Ürünler getirilemedi.");
          return [];
        }

        const data = await response.json();

        const products = data.products;

        console.log(products);

        return products;
      }

      async function renderProducts() {
        const products = await fetchProducts(url);

        console.log("render içindeki ürünler", products);
        
        
        let htmlProducts = document.getElementById("products");

        console.log(cartProducts);

        if (cartProducts.length > 0) {
          cartProducts.forEach((element) => {
            htmlProducts.innerHTML += `
            <li class="product" id="${element}">
                <img src='${products[element].thumbnail}' alt="">
                <h2 class="title">${products[element].title}</h2>
                <p class="price">$${products[element].price}</p>
                <div class="remove__button__container">                
                  <svg onclick="removeProduct(${element})" class="remove__button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" height="16"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path fill="red" d="M135.2 17.7L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-7.2-14.3C307.4 6.8 296.3 0 284.2 0L163.8 0c-12.1 0-23.2 6.8-28.6 17.7zM416 128L32 128 53.2 467c1.6 25.3 22.6 45 47.9 45l245.8 0c25.3 0 46.3-19.7 47.9-45L416 128z"/>
                  </svg>
                </div>
            </li>
            `;
          });
        }
      }


      function removeProduct(product_id) {
        
        document.getElementById(product_id).style.display = "none";

        const willBeDeletedIndex = cartProducts.indexOf(product_id);

        cartProducts.splice(willBeDeletedIndex, 1);

        localStorage.setItem("cartProducts", JSON.stringify(cartProducts));
        
      }

      renderProducts()
    </script>
  </body>
</html>
