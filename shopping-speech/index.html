<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Listing</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header>
      <a href="index.html" id="logo">
        <img src="images/main-logo.png" alt="" />
      </a>

      <nav>
        <ul id="nav__items">
          <li class="nav__item"><a href="#products">Products</a></li>
          <li class="nav__item"><a href="cart.html">Cart</a></li>
          <li class="nav__item"><a href="#about">About Us</a></li>
          <li class="nav__item"><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="welcomer__banner">
        <button id="speech__cart" onclick="startListening()">🎤 Add Products via Speech</button>
        <h2>Welcome to MPol's Shop</h2>
      </section>

      <div id="products">

      </div>
    </main>

    <script>

      let url = 'https://dummyjson.com/products';
      const cartProducts = JSON.parse(localStorage.getItem("cartProducts")) || [];

      async function fetchProducts(url) {

        const response = await fetch(url);
        
        if(!response.ok) {
          alert("Ürünler getirilemedi.");
          return [];
        }

        const data = await response.json();
        
        const products = data.products;        

        console.log(products);
        

        return products;
        
      }

      async function listProducts() {

        const products = await fetchProducts(url);
      
        const products__container = document.getElementById("products");

        for(let i = 0; i < products.length; i++) {
          products__container.innerHTML += `
                <div class="product__card">
                  <img
                    class="product__image"
                    src=${products[i].thumbnail}
                    alt=""
                  />
                  <h4 class="product__title">${products[i].title}</h4>
                  <div class="price">
                    <span class="product__discount">${products[i].discountPercentage}%</span>
                    <span class="product__price">$${products[i].price}</span>
                  </div>
                  <div class="cart__button__container">
                    <button onclick="addToCart(${i})" class="cart__button">Add to Cart</button>
                  </div>
                </div>
          `;
        }


      }

      function addToCart(index) {
        cartProducts.push(index);
        localStorage.setItem("cartProducts", JSON.stringify(cartProducts));
      }

      function startListening() {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          alert("Tarayıcınız Web Speech API desteklemiyor.");
          return;
        }

        const recognition = new SpeechRecognition();

        recognition.lang = "tr-TR";
        recognition.start();

        recognition.onresult = function (event) {
          console.log(event);

          const command = event.results[0][0].transcript.toLowerCase();
          
          if(command.includes("ekle") || command.includes("sepete ekle") || command.includes("satın almak istiyorum")) {
            const willBeAdded = parseInt(command);
            addToCart(willBeAdded - 1);
            window.location.href = 'cart.html';
          } else {
            alert("Sepete ürün eklememi sağlayacak herhangi bir komut vermedin.")
          }


        };

        recognition.onerror = function () {
          alert("Hata: Ses algılanamadı.");
        };
      }
    
      listProducts();

    </script>
  </body>
</html>
