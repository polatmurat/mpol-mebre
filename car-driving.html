<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araba Oyunu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex border-b mt-20">
        <img id="araba" src="araba.png" style="margin-left: 0px;" class="h-[200px]" alt="">
        <img id="finish" src="finish.png" class="absolute right-0 mb-3 h-[200px]" alt="">
    </div>

    <div class="flex justify-center">
        <img onclick="ileriGit()" id="hizlan" src="gas.png" class="h-[200px] cursor-pointer" alt="">
    </div>



    <script>
        function ileriGit() {
            let mesafe = document.querySelector("#araba").style.marginLeft;
            console.log(mesafe);
            
            mesafe = parseInt(mesafe.replace("px", ""));
            
            if(mesafe <= 1150) {
                document.querySelector("#araba").style.marginLeft = `${mesafe + 50}px`
            }            

            
        }
    </script>
</body>
</html>
